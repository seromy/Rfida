{% extends "base.html" %}
{% block title %}公司{% endblock %}
{% block content %}

<div class="page-header">
  <div>
    <div class="eyebrow">客戶名單</div>
    <h1>公司</h1>
  </div>
</div>

<div class="card">
  <h3>新增公司</h3>
  <form method="post" action="{{ url_for('dashboard.company_create') }}" class="form-inline">
    <div class="field">
      <label for="name">公司名稱</label>
      <input type="text" id="name" name="name" placeholder="陳大文攝影工作室" required>
    </div>
    <button class="btn" type="submit">新增</button>
  </form>
</div>

<div class="card card-flush">
  {% if items %}
  <table>
    <thead><tr><th>公司名稱</th><th></th></tr></thead>
    <tbody>
      {% for c in items %}
      <tr>
        <td>{{ c.name }}</td>
        <td style="text-align:right;">
          <form method="post" action="{{ url_for('dashboard.company_delete', company_id=c.id) }}" onsubmit="return confirm('確定刪除「{{ c.name }}」?');">
            <button class="btn btn-ghost btn-sm" type="submit">刪除</button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
  {% else %}
    <div class="empty-state">未有公司紀錄</div>
  {% endif %}
</div>

{% endblock %}
